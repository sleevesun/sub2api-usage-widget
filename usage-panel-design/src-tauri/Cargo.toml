[package]
name = "sub2api-usage-widget"
version = "0.3.0"
description = "A lightweight Sub2API usage tray widget"
authors = ["Sub2API Usage Widget"]
edition = "2021"

[lib]
name = "sub2api_usage_widget_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
dirs = "6"
keyring = { version = "3.6", features = ["apple-native", "windows-native"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.11", features = ["tray-icon"] }
tauri-plugin-notification = "2"
tauri-plugin-process = "=2.3.1"
tauri-plugin-updater = "=2.10.1"
tokio = { version = "1", features = ["time"] }
toml = "0.8"

[dev-dependencies]
base64 = "0.22"
minisign-verify = "=0.2.5"
