<!doctype html>
<html lang="zh-CN" data-theme="light" data-variant="orb">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Sub2API liquid orb visual prototype" />
    <title>Sub2API · Liquid Orb prototype</title>
    <style>
      :root {
        color-scheme: light;
        --page: #f4f5f4;
        --page-glow: rgba(139, 201, 214, 0.18);
        --surface: rgba(255, 255, 255, 0.74);
        --surface-solid: #ffffff;
        --surface-soft: rgba(246, 248, 247, 0.76);
        --text: #1d1d1f;
        --muted: #85878b;
        --faint: #b2b4b7;
        --line: rgba(30, 33, 35, 0.1);
        --line-strong: rgba(30, 33, 35, 0.17);
        --water: #8acbd5;
        --water-deep: #54aebd;
        --water-glow: rgba(91, 189, 204, 0.35);
        --signal: #ec6c4c;
        --signal-soft: rgba(236, 108, 76, 0.14);
        --ok: #4ca876;
        --ok-soft: rgba(76, 168, 118, 0.14);
        --shadow: 0 28px 80px rgba(32, 53, 56, 0.12), 0 2px 8px rgba(32, 53, 56, 0.07);
        --orb-shadow: 0 28px 65px rgba(74, 173, 187, 0.2), inset 0 1px 2px rgba(255, 255, 255, 0.8), inset 0 -18px 28px rgba(52, 142, 158, 0.11);
        --ease: cubic-bezier(0.22, 0.8, 0.26, 1);
      }

      :root[data-theme="dark"] {
        color-scheme: dark;
        --page: #111315;
        --page-glow: rgba(74, 159, 178, 0.15);
        --surface: rgba(34, 37, 39, 0.78);
        --surface-solid: #222527;
        --surface-soft: rgba(29, 32, 34, 0.8);
        --text: #f5f5f6;
        --muted: #9ea1a5;
        --faint: #686c70;
        --line: rgba(255, 255, 255, 0.1);
        --line-strong: rgba(255, 255, 255, 0.18);
        --water: #6fb9c8;
        --water-deep: #3b8f9f;
        --water-glow: rgba(82, 178, 196, 0.25);
        --signal: #f27b5b;
        --signal-soft: rgba(242, 123, 91, 0.14);
        --ok: #6ac18c;
        --ok-soft: rgba(106, 193, 140, 0.15);
        --shadow: 0 30px 90px rgba(0, 0, 0, 0.4), 0 2px 10px rgba(0, 0, 0, 0.2);
        --orb-shadow: 0 30px 72px rgba(43, 138, 154, 0.21), inset 0 1px 2px rgba(255, 255, 255, 0.18), inset 0 -18px 28px rgba(11, 51, 58, 0.26);
      }

      * { box-sizing: border-box; }

      html {
        min-width: 320px;
        background: var(--page);
      }

      body {
        min-width: 320px;
        margin: 0;
        padding: 22px 22px 102px;
        color: var(--text);
        background:
          radial-gradient(circle at 76% -5%, var(--page-glow), transparent 28rem),
          radial-gradient(circle at 3% 105%, rgba(236, 108, 76, 0.05), transparent 24rem),
          var(--page);
        font-family: "Segoe UI Variable", "Segoe UI", "SF Pro Display", "SF Pro Text", system-ui, -apple-system, sans-serif;
        -webkit-font-smoothing: antialiased;
        transition: background 320ms var(--ease), color 220ms var(--ease);
      }

      button { font: inherit; color: inherit; }

      button:focus-visible {
        outline: 3px solid rgba(92, 174, 191, 0.34);
        outline-offset: 3px;
      }

      .app-shell {
        width: min(1160px, 100%);
        min-height: 720px;
        margin: 0 auto;
        overflow: hidden;
        border: 1px solid var(--line-strong);
        border-radius: 30px;
        background: var(--surface);
        box-shadow: var(--shadow);
        backdrop-filter: blur(26px) saturate(130%);
        -webkit-backdrop-filter: blur(26px) saturate(130%);
      }

      .app-chrome {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 18px;
        min-height: 76px;
        padding: 18px 25px;
        border-bottom: 1px solid var(--line);
      }

      .wordmark,
      .chrome-actions,
      .theme-control,
      .small-status,
      .account-line,
      .orb-caption,
      .dock-row,
      .status-row {
        display: flex;
        align-items: center;
      }

      .wordmark { gap: 10px; }

      .wordmark > strong {
        color: var(--text);
        font-size: 14px;
        font-weight: 720;
        letter-spacing: -0.03em;
      }

      .wordmark > span:last-child {
        color: var(--faint);
        font-size: 11px;
      }

      .tiny-orb {
        position: relative;
        width: 29px;
        height: 29px;
        overflow: hidden;
        border: 1px solid rgba(255, 255, 255, 0.74);
        border-radius: 50%;
        background: rgba(198, 231, 235, 0.35);
        box-shadow: inset 0 1px 2px rgba(255, 255, 255, 0.9), 0 7px 13px rgba(83, 168, 182, 0.18);
      }

      .tiny-orb::after,
      .liquid-orb::after {
        position: absolute;
        top: 9%;
        left: 19%;
        width: 35%;
        height: 20%;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.58);
        content: "";
        filter: blur(1px);
        transform: rotate(-24deg);
      }

      .tiny-water {
        position: absolute;
        right: -15%;
        bottom: -3%;
        left: -15%;
        height: 78%;
        border-radius: 48% 52% 0 0;
        background: linear-gradient(180deg, var(--water), var(--water-deep));
      }

      .chrome-actions { gap: 10px; }

      .theme-control {
        gap: 3px;
        padding: 4px;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: var(--surface-soft);
      }

      .theme-control button,
      .float-button,
      .account-button,
      .switch-arrow {
        border: 0;
        cursor: pointer;
        transition: background 180ms var(--ease), color 180ms var(--ease), transform 180ms var(--ease), border-color 180ms var(--ease);
      }

      .theme-control button {
        min-height: 26px;
        padding: 0 9px;
        border-radius: 8px;
        color: var(--muted);
        background: transparent;
        font-size: 10px;
        font-weight: 650;
      }

      .theme-control button:hover,
      .theme-control button[aria-pressed="true"] {
        color: var(--text);
        background: var(--surface-solid);
        box-shadow: 0 1px 4px rgba(0, 0, 0, 0.08);
      }

      .theme-control button[aria-pressed="true"] { color: var(--water-deep); }

      .float-button {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        min-height: 36px;
        padding: 0 12px;
        border: 1px solid var(--line);
        border-radius: 11px;
        background: var(--surface-solid);
        font-size: 10px;
        font-weight: 700;
      }

      .float-button:hover { transform: translateY(-1px); border-color: rgba(86, 172, 188, 0.4); }

      .signal-dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--ok);
        box-shadow: 0 0 0 4px var(--ok-soft);
      }

      .stage {
        min-height: 644px;
        padding: 24px;
      }

      .variant {
        min-height: 596px;
        animation: appear 420ms var(--ease) both;
      }

      @keyframes appear {
        from { opacity: 0; transform: translateY(7px); }
        to { opacity: 1; transform: translateY(0); }
      }

      .eyebrow {
        color: var(--faint);
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.1em;
        text-transform: uppercase;
      }

      .liquid-orb {
        --level: 84;
        position: relative;
        width: var(--orb-size, 250px);
        height: var(--orb-size, 250px);
        overflow: hidden;
        flex: 0 0 auto;
        border: 1px solid rgba(255, 255, 255, 0.72);
        border-radius: 50%;
        background: linear-gradient(145deg, rgba(255, 255, 255, 0.43), rgba(198, 231, 235, 0.22));
        box-shadow: var(--orb-shadow);
        isolation: isolate;
        transform: translateZ(0);
      }

      .liquid-orb::before {
        position: absolute;
        z-index: 3;
        inset: 0;
        border: 1px solid rgba(255, 255, 255, 0.2);
        border-radius: inherit;
        box-shadow: inset 0 0 0 7px rgba(255, 255, 255, 0.05), inset 0 0 26px rgba(255, 255, 255, 0.25);
        content: "";
        pointer-events: none;
      }

      .liquid-orb::after { z-index: 4; }

      .orb-water {
        position: absolute;
        z-index: 1;
        right: -8%;
        bottom: calc((var(--level) - 100) * 1%);
        left: -8%;
        height: 115%;
        background: linear-gradient(180deg, var(--water), var(--water-deep));
        box-shadow: 0 -7px 18px var(--water-glow);
        transition: bottom 600ms var(--ease), background 260ms var(--ease);
      }

      .orb-water::before,
      .orb-water::after {
        position: absolute;
        top: -9px;
        left: -4%;
        width: 108%;
        height: 20px;
        border-radius: 50%;
        background: rgba(214, 248, 249, 0.72);
        content: "";
        filter: blur(0.3px);
      }

      .orb-water::after {
        top: -4px;
        left: -16%;
        width: 123%;
        opacity: 0.55;
        transform: rotate(2deg);
      }

      .orb-content {
        position: absolute;
        z-index: 5;
        inset: 0;
        display: grid;
        place-items: center;
        pointer-events: none;
        text-align: center;
      }

      .orb-content strong {
        display: block;
        color: #fff;
        font-size: clamp(34px, 5vw, 52px);
        font-weight: 720;
        letter-spacing: -0.09em;
        line-height: 1;
        text-shadow: 0 2px 12px rgba(24, 93, 104, 0.24);
      }

      .orb-content span {
        display: block;
        margin-top: 8px;
        color: rgba(255, 255, 255, 0.84);
        font-size: 10px;
        font-weight: 650;
        letter-spacing: 0.04em;
      }

      .orb-low .orb-water { background: linear-gradient(180deg, #e9ae62, #cb753e); }
      .orb-low { --water-glow: rgba(229, 157, 76, 0.28); }

      .variant-orb {
        display: grid;
        grid-template-columns: 205px minmax(0, 1fr) 210px;
        gap: 34px;
        align-items: center;
        min-height: 596px;
        padding: 32px 38px;
      }

      .orb-rail {
        align-self: stretch;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: 8px 0;
      }

      .orb-rail h1 {
        margin: 10px 0 5px;
        color: var(--text);
        font-size: 24px;
        font-weight: 710;
        letter-spacing: -0.06em;
      }

      .orb-rail p,
      .orb-note,
      .orb-meta p,
      .orb-meta span {
        margin: 0;
        color: var(--muted);
        font-size: 11px;
        line-height: 1.55;
      }

      .account-stack { display: grid; gap: 6px; margin-top: 31px; }

      .account-button {
        display: flex;
        align-items: center;
        gap: 9px;
        width: 100%;
        min-height: 39px;
        padding: 0 9px;
        border: 1px solid transparent;
        border-radius: 11px;
        background: transparent;
        text-align: left;
      }

      .account-button:hover,
      .account-button.active { border-color: var(--line); background: var(--surface-solid); }

      .account-avatar {
        display: grid;
        width: 26px;
        height: 26px;
        place-items: center;
        border-radius: 9px;
        color: var(--water-deep);
        background: rgba(138, 203, 213, 0.2);
        font-size: 10px;
        font-weight: 750;
      }

      .account-button strong {
        display: block;
        color: var(--text);
        font-size: 11px;
        font-weight: 680;
      }

      .account-button small {
        display: block;
        margin-top: 2px;
        color: var(--faint);
        font-size: 9px;
      }

      .rail-bottom { display: grid; gap: 11px; }

      .orb-note { max-width: 165px; color: var(--faint); }

      .orb-center {
        display: grid;
        place-items: center;
        min-width: 0;
      }

      .orb-center .liquid-orb { --orb-size: min(330px, 34vw); }

      .orb-center-caption { margin-top: 27px; text-align: center; }

      .orb-center-caption strong {
        display: block;
        color: var(--text);
        font-size: 14px;
        font-weight: 700;
      }

      .orb-center-caption span {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        margin-top: 8px;
        color: var(--muted);
        font-size: 10px;
      }

      .orb-meta { display: grid; gap: 0; }

      .orb-meta-row {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 12px;
        min-height: 56px;
        border-top: 1px solid var(--line);
      }

      .orb-meta-row:first-child { border-top: 0; }

      .orb-meta-row strong {
        color: var(--text);
        font-size: 15px;
        font-weight: 690;
        letter-spacing: -0.04em;
      }

      .orb-meta-row span { color: var(--muted); font-size: 10px; }

      .variant-drop {
        position: relative;
        display: grid;
        min-height: 596px;
        place-items: center;
        overflow: hidden;
        border-radius: 27px;
        background:
          radial-gradient(circle at 50% 38%, var(--page-glow), transparent 18rem),
          var(--surface-soft);
      }

      .drop-topbar {
        position: absolute;
        top: 0;
        right: 0;
        left: 0;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 24px 28px;
      }

      .drop-topbar span:last-child { color: var(--faint); font-size: 10px; }

      .drop-center { display: grid; place-items: center; padding-top: 9px; text-align: center; }

      .drop-center .liquid-orb { --orb-size: min(360px, 43vw); }

      .drop-center h2 {
        margin: 27px 0 0;
        color: var(--text);
        font-size: 22px;
        font-weight: 710;
        letter-spacing: -0.06em;
      }

      .drop-center p { margin: 7px 0 0; color: var(--muted); font-size: 11px; }

      .drop-controls {
        position: absolute;
        right: 27px;
        bottom: 25px;
        left: 27px;
        display: flex;
        align-items: end;
        justify-content: space-between;
        gap: 18px;
      }

      .drop-controls .account-stack { display: flex; gap: 5px; margin: 0; }
      .drop-controls .account-button { width: auto; padding: 0 8px; }
      .drop-controls .account-button small { display: none; }
      .drop-controls .account-button strong { font-size: 10px; }

      .drop-hint { color: var(--faint); font-size: 10px; text-align: right; }

      .variant-dock {
        display: grid;
        grid-template-columns: 104px minmax(0, 1fr);
        min-height: 596px;
        overflow: hidden;
        border-radius: 24px;
        background: var(--surface-soft);
      }

      .dock-side {
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 25px 12px;
        border-right: 1px solid var(--line);
      }

      .dock-side .liquid-orb { --orb-size: 58px; }
      .dock-side .orb-content strong { font-size: 13px; }
      .dock-side .orb-content span { display: none; }

      .dock-side h2 {
        margin: 18px 0 0;
        color: var(--text);
        font-size: 12px;
        font-weight: 700;
        writing-mode: vertical-rl;
      }

      .dock-side .signal-dot { margin-top: auto; }

      .dock-main { min-width: 0; padding: 31px 34px; }

      .dock-heading {
        display: flex;
        align-items: end;
        justify-content: space-between;
        gap: 20px;
        margin-bottom: 27px;
      }

      .dock-heading h2 {
        margin: 8px 0 0;
        color: var(--text);
        font-size: 29px;
        font-weight: 720;
        letter-spacing: -0.07em;
      }

      .dock-heading p { margin: 0; color: var(--muted); font-size: 11px; }

      .dock-list { border-top: 1px solid var(--line); }

      .dock-row {
        justify-content: space-between;
        gap: 20px;
        min-height: 113px;
        border-bottom: 1px solid var(--line);
      }

      .dock-row-main { display: flex; align-items: center; gap: 14px; min-width: 0; }
      .dock-row-main .liquid-orb { --orb-size: 56px; }
      .dock-row-main .orb-content strong { font-size: 12px; }
      .dock-row-main .orb-content span { display: none; }

      .dock-row-name strong { display: block; color: var(--text); font-size: 12px; font-weight: 700; }
      .dock-row-name span { display: block; margin-top: 5px; color: var(--muted); font-size: 10px; }

      .dock-row-value { text-align: right; }
      .dock-row-value strong { display: block; color: var(--text); font-size: 19px; font-weight: 700; letter-spacing: -0.05em; }
      .dock-row-value span { display: block; margin-top: 5px; color: var(--muted); font-size: 10px; }

      .dock-footer {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
        margin-top: 27px;
      }

      .status-row { gap: 9px; color: var(--muted); font-size: 10px; }

      .dock-footer-note { color: var(--faint); font-size: 10px; }

      .floating-orb {
        position: fixed;
        z-index: 20;
        top: 105px;
        right: max(25px, calc((100vw - 1160px) / 2 + 25px));
        display: grid;
        width: 73px;
        height: 73px;
        place-items: center;
        border: 0;
        border-radius: 50%;
        background: transparent;
        cursor: pointer;
        opacity: 1;
        transform: translateY(0) scale(1);
        transition: opacity 220ms var(--ease), transform 280ms var(--ease), visibility 220ms var(--ease);
      }

      .floating-orb.is-hidden { visibility: hidden; opacity: 0; pointer-events: none; transform: translateY(-7px) scale(0.88); }
      .floating-orb .liquid-orb { --orb-size: 73px; width: 73px; height: 73px; }
      .floating-orb .orb-content strong { font-size: 16px; }
      .floating-orb .orb-content span { display: none; }

      .floating-orb::after {
        position: absolute;
        right: -9px;
        bottom: -3px;
        width: 15px;
        height: 15px;
        border: 3px solid var(--page);
        border-radius: 50%;
        background: var(--ok);
        content: "";
        box-shadow: 0 0 0 2px var(--ok-soft);
      }

      .prototype-switcher {
        position: fixed;
        z-index: 40;
        right: 50%;
        bottom: 17px;
        display: flex;
        align-items: center;
        gap: 7px;
        min-height: 47px;
        padding: 6px;
        border: 1px solid var(--line-strong);
        border-radius: 16px;
        background: color-mix(in srgb, var(--surface-solid) 91%, transparent);
        box-shadow: var(--shadow);
        backdrop-filter: blur(22px) saturate(140%);
        -webkit-backdrop-filter: blur(22px) saturate(140%);
        transform: translateX(50%);
      }

      .switch-arrow {
        display: grid;
        width: 33px;
        height: 33px;
        place-items: center;
        border-radius: 10px;
        background: transparent;
        font-size: 18px;
      }

      .switch-arrow:hover { background: var(--surface-soft); transform: scale(1.04); }

      .switch-label {
        min-width: 150px;
        color: var(--text);
        font-size: 10px;
        font-weight: 750;
        text-align: center;
      }

      .switch-label small { display: block; margin-top: 3px; color: var(--faint); font-size: 9px; font-weight: 600; }

      .prototype-stamp {
        position: fixed;
        right: 22px;
        bottom: 23px;
        display: inline-flex;
        align-items: center;
        gap: 7px;
        color: var(--faint);
        font-size: 9px;
        font-weight: 700;
      }

      .prototype-stamp i { width: 5px; height: 5px; border-radius: 50%; background: var(--signal); }

      @media (max-width: 900px) {
        body { padding: 12px 12px 96px; }
        .app-shell { border-radius: 23px; }
        .app-chrome { align-items: flex-start; flex-direction: column; padding: 19px; }
        .chrome-actions { width: 100%; justify-content: space-between; }
        .stage { padding: 14px; }
        .variant-orb { grid-template-columns: 175px minmax(0, 1fr); gap: 18px; padding: 25px; }
        .variant-orb .orb-meta { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; }
        .variant-orb .orb-meta-row { border-top: 0; border-left: 1px solid var(--line); padding-left: 15px; }
        .variant-orb .orb-meta-row:first-child { border-left: 0; padding-left: 0; }
        .orb-center .liquid-orb { --orb-size: min(295px, 40vw); }
        .floating-orb { top: 91px; right: 19px; }
        .prototype-stamp { display: none; }
      }

      @media (max-width: 620px) {
        .theme-control { flex: 1; justify-content: space-between; }
        .theme-control button { flex: 1; padding: 0 4px; font-size: 9px; }
        .float-button { padding: 0 10px; font-size: 9px; }
        .variant-orb { display: flex; min-height: 596px; flex-direction: column; align-items: stretch; padding: 25px 20px; }
        .orb-rail { align-self: auto; }
        .orb-rail h1 { margin-top: 7px; }
        .account-stack { display: flex; margin-top: 17px; }
        .account-button { width: auto; padding-right: 8px; }
        .account-button small { display: none; }
        .orb-center { margin: 29px 0; }
        .orb-center .liquid-orb, .drop-center .liquid-orb { --orb-size: min(250px, 70vw); }
        .variant-orb .orb-meta { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
        .variant-orb .orb-meta-row { display: block; min-height: auto; padding: 11px 0 0; border-top: 1px solid var(--line); border-left: 0; }
        .variant-orb .orb-meta-row:first-child { padding-top: 11px; border-top: 1px solid var(--line); }
        .orb-meta-row strong { display: block; margin-top: 5px; font-size: 13px; }
        .variant-drop { min-height: 596px; }
        .drop-topbar { padding: 21px; }
        .drop-controls { right: 17px; bottom: 19px; left: 17px; align-items: center; flex-direction: column; }
        .drop-hint { text-align: center; }
        .variant-dock { grid-template-columns: 70px minmax(0, 1fr); }
        .dock-main { padding: 25px 18px; }
        .dock-heading { align-items: flex-start; flex-direction: column; gap: 7px; }
        .dock-heading h2 { font-size: 24px; }
        .dock-row { gap: 10px; min-height: 96px; }
        .dock-row-main { gap: 9px; }
        .dock-row-main .liquid-orb { --orb-size: 46px; }
        .dock-row-value strong { font-size: 16px; }
        .dock-footer { align-items: flex-start; flex-direction: column; gap: 10px; }
        .switch-label { min-width: 124px; }
      }

      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; }
      }

      @media (prefers-reduced-transparency: reduce) {
        .app-shell, .prototype-switcher { background: var(--surface-solid); backdrop-filter: none; -webkit-backdrop-filter: none; }
      }
    </style>
  </head>
  <body>
    <div class="app-shell">
      <header class="app-chrome">
        <div class="wordmark"><span class="tiny-orb"><i class="tiny-water"></i></span><strong>Sub2API</strong><span>usage</span></div>
        <div class="chrome-actions">
          <div class="theme-control" aria-label="外观">
            <button type="button" data-theme-choice="system">跟随系统</button>
            <button type="button" data-theme-choice="light" aria-pressed="true">浅色</button>
            <button type="button" data-theme-choice="dark">深色</button>
          </div>
          <button class="float-button" id="floatToggle" type="button"><span class="signal-dot"></span>显示浮窗</button>
        </div>
      </header>
      <main class="stage" id="stage"></main>
    </div>

    <button class="floating-orb" id="floatingOrb" type="button" aria-label="打开 Sub2API 用量面板" title="点击打开用量面板">
      <span class="liquid-orb" data-orb data-level="84"><i class="orb-water"></i><span class="orb-content"><strong data-percent>84%</strong><span>剩余</span></span></span>
    </button>

    <nav class="prototype-switcher" aria-label="液态球体方案切换">
      <button class="switch-arrow" type="button" data-direction="-1" aria-label="上一个方案">‹</button>
      <div class="switch-label" id="switchLabel">A · Orb dashboard<small>← → 切换方案</small></div>
      <button class="switch-arrow" type="button" data-direction="1" aria-label="下一个方案">›</button>
    </nav>

    <div class="prototype-stamp"><i></i> visual prototype</div>

    <script>
      (() => {
        // Three liquid-orb layouts, switchable with ?variant=orb|drop|dock.
        const variants = [
          { id: "orb", label: "A · Orb dashboard" },
          { id: "drop", label: "B · Quiet water" },
          { id: "dock", label: "C · Native dock" },
        ];
        const accounts = {
          sunxiao: { name: "孙骁", initials: "孙", model: "Codex", percent: 84, money: "$84.20", reset: "约 3 天后刷新" },
          relay: { name: "Team Relay", initials: "TR", model: "GPT-5", percent: 61, money: "$61.80", reset: "约 18 小时后刷新" },
        };
        const params = new URLSearchParams(window.location.search);
        const initialVariant = params.get("variant");
        let activeVariant = variants.some((item) => item.id === initialVariant) ? initialVariant : "orb";
        let selectedAccount = "sunxiao";
        let themePreference = null;
        let systemDark = window.matchMedia?.("(prefers-color-scheme: dark)")?.matches ?? false;
        let floatVisible = true;
        const root = document.documentElement;
        const stage = document.getElementById("stage");
        const floatingOrb = document.getElementById("floatingOrb");
        const switchLabel = document.getElementById("switchLabel");

        const accountButtons = () => `
          <div class="account-stack">
            <button class="account-button ${selectedAccount === "sunxiao" ? "active" : ""}" type="button" data-account="sunxiao"><span class="account-avatar">孙</span><span><strong>孙骁</strong><small>Codex</small></span></button>
            <button class="account-button ${selectedAccount === "relay" ? "active" : ""}" type="button" data-account="relay"><span class="account-avatar">TR</span><span><strong>Relay</strong><small>GPT-5</small></span></button>
          </div>`;

        const orbMarkup = (className = "") => `<span class="liquid-orb ${className}" data-orb data-level="84"><i class="orb-water"></i><span class="orb-content"><strong data-percent>84%</strong><span>剩余</span></span></span>`;

        const orbVariant = () => `
          <section class="variant variant-orb">
            <aside class="orb-rail">
              <div><div class="eyebrow">Usage</div><h1 data-name>孙骁</h1><p data-model>Codex · 当前通道</p>${accountButtons()}</div>
              <div class="rail-bottom"><div class="small-status"><span class="signal-dot"></span><span class="orb-note">同步正常 · <span data-reset>约 3 天后刷新</span></span></div></div>
            </aside>
            <div class="orb-center"><div class="orb-hero">${orbMarkup()}</div><div class="orb-center-caption"><strong>剩余额度</strong><span><span class="signal-dot"></span>轻量监控中</span></div></div>
            <div class="orb-meta">
              <div class="orb-meta-row"><span>百分比</span><strong data-percent>84%</strong></div>
              <div class="orb-meta-row"><span>余额</span><strong data-money>$84.20</strong></div>
              <div class="orb-meta-row"><span>刷新</span><strong>10 min</strong></div>
            </div>
          </section>`;

        const dropVariant = () => `
          <section class="variant variant-drop">
            <div class="drop-topbar"><span class="eyebrow">Sub2API · usage</span><span>fluid status</span></div>
            <div class="drop-center">${orbMarkup()}<h2 data-name>孙骁</h2><p><span data-model>Codex</span> · <span data-reset>约 3 天后刷新</span></p></div>
            <div class="drop-controls">${accountButtons()}<span class="drop-hint">球体水位 = 当前剩余量</span></div>
          </section>`;

        const dockVariant = () => `
          <section class="variant variant-dock">
            <aside class="dock-side">${orbMarkup()}<h2>Sub2API</h2><span class="signal-dot"></span></aside>
            <div class="dock-main">
              <div class="dock-heading"><div><div class="eyebrow">Usage monitor</div><h2>剩余量</h2></div><p>后台轻量运行</p></div>
              <div class="dock-list">
                <div class="dock-row"><div class="dock-row-main">${orbMarkup()}<div class="dock-row-name"><strong>孙骁</strong><span>Codex · <span data-reset>约 3 天后刷新</span></span></div></div><div class="dock-row-value"><strong data-money>$84.20</strong><span data-percent>84%</span></div></div>
                <div class="dock-row"><div class="dock-row-main">${orbMarkup("orb-low")}<div class="dock-row-name"><strong>Team Relay</strong><span>GPT-5 · 空闲</span></div></div><div class="dock-row-value"><strong>$61.80</strong><span>61%</span></div></div>
              </div>
              <div class="dock-footer"><div class="status-row"><span class="signal-dot"></span>连接正常</div><div class="dock-footer-note">点击托盘球体打开面板</div></div>
            </div>
          </section>`;

        function render() {
          const item = variants.find((variant) => variant.id === activeVariant) || variants[0];
          root.dataset.variant = item.id;
          switchLabel.innerHTML = `${item.label}<small>← → 切换方案</small>`;
          stage.innerHTML = item.id === "orb" ? orbVariant() : item.id === "drop" ? dropVariant() : dockVariant();
          const url = new URL(window.location.href);
          url.searchParams.set("variant", item.id);
          window.history.replaceState({}, "", url);
          document.querySelectorAll("[data-account]").forEach((button) => button.addEventListener("click", () => { selectedAccount = button.dataset.account; render(); }));
          syncTheme();
          syncAccount();
        }

        function syncTheme() {
          const theme = themePreference === "system" ? (systemDark ? "dark" : "light") : (themePreference || "light");
          root.dataset.theme = theme;
          document.querySelectorAll("[data-theme-choice]").forEach((button) => {
            button.setAttribute("aria-pressed", String(button.dataset.themeChoice === themePreference || (themePreference === null && button.dataset.themeChoice === "light")));
          });
        }

        function syncAccount() {
          const account = accounts[selectedAccount];
          document.querySelectorAll("[data-name]").forEach((node) => { node.textContent = account.name; });
          document.querySelectorAll("[data-model]").forEach((node) => { node.textContent = account.model; });
          document.querySelectorAll("[data-reset]").forEach((node) => { node.textContent = account.reset; });
          document.querySelectorAll("[data-money]").forEach((node) => { node.textContent = account.money; });
          document.querySelectorAll("[data-percent]").forEach((node) => { node.textContent = `${account.percent}%`; });
          document.querySelectorAll("[data-orb]").forEach((orb) => { orb.style.setProperty("--level", account.percent); });
          floatingOrb.querySelector("[data-percent]").textContent = `${account.percent}%`;
          floatingOrb.querySelector("[data-orb]").style.setProperty("--level", account.percent);
          document.querySelectorAll("[data-account]").forEach((button) => button.classList.toggle("active", button.dataset.account === selectedAccount));
        }

        function setFloatVisible(visible) {
          floatVisible = visible;
          floatingOrb.classList.toggle("is-hidden", !visible);
          document.getElementById("floatToggle").setAttribute("aria-pressed", String(visible));
        }

        function moveVariant(direction) {
          const index = variants.findIndex((variant) => variant.id === activeVariant);
          activeVariant = variants[(index + direction + variants.length) % variants.length].id;
          render();
        }

        document.querySelectorAll("[data-theme-choice]").forEach((button) => button.addEventListener("click", () => {
          themePreference = button.dataset.themeChoice === "light" ? null : button.dataset.themeChoice;
          syncTheme();
        }));
        document.querySelectorAll("[data-direction]").forEach((button) => button.addEventListener("click", () => moveVariant(Number(button.dataset.direction))));
        document.getElementById("floatToggle").addEventListener("click", () => setFloatVisible(!floatVisible));
        floatingOrb.addEventListener("click", () => { setFloatVisible(false); document.querySelector(".app-shell").scrollIntoView({ behavior: "smooth", block: "start" }); });
        document.addEventListener("keydown", (event) => {
          if (["INPUT", "TEXTAREA", "SELECT"].includes(document.activeElement?.tagName) || document.activeElement?.isContentEditable) return;
          if (event.key === "ArrowLeft") moveVariant(-1);
          if (event.key === "ArrowRight") moveVariant(1);
        });
        const media = window.matchMedia?.("(prefers-color-scheme: dark)");
        media?.addEventListener?.("change", (event) => { systemDark = event.matches; if (themePreference === "system") syncTheme(); });
        media?.addListener?.((event) => { systemDark = event.matches; if (themePreference === "system") syncTheme(); });
        render();
        syncTheme();
        setFloatVisible(true);
      })();
    </script>
  </body>
</html>
